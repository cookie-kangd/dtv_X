name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci.keystore \
            -alias dtv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dtvci123456 \
            -keypass dtvci123456 \
            -dname "CN=DTV CI, OU=CI, O=DTV, L=Beijing, ST=Beijing, C=CN"
          printf 'storeFile=ci.keystore\nstorePassword=dtvci123456\nkeyAlias=dtv\nkeyPassword=dtvci123456\n' > keystore.properties

      - name: Build release APK
        # Skip the Aliyun mirror in CI (unstable / 502) and use Google/Maven Central directly.
        env:
          DTV_NO_ALIYUN_MIRROR: "true"
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dtv-mobile-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: ${{ steps.apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.2.0"
          TAG="v${VERSION}-${{ github.run_number }}"
          {
            echo "## DTV Mobile 更新说明"
            echo ""
            cat CHANGELOG.md
          } > release_body.md
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk_path }}" \
            --title "DTV Mobile v${VERSION} (Run #${{ github.run_number }})" \
            --notes-file release_body.md \
            || echo "::warning::Release creation skipped (tag may already exist)"
