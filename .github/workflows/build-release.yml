name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # 应用版本号（需与 androidApp/build.gradle.kts 的 versionName 保持一致）
      APP_VERSION: "0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write signing config (use repo-committed persistent keystore)
        # 关键：使用仓库中固定提交（androidApp/signing/release.keystore）的同一个签名，
        # 这样所有历史/未来构建都共用一把密钥，v0.1 才能正常 OTA 升级覆盖安装到 v0.1.1，
        # 不会再出现「签名冲突 / INSTALL_FAILED_UPDATE_INCOMPATIBLE」。
        run: |
          printf 'storeFile=signing/release.keystore\nstorePassword=dtvci123456\nkeyAlias=dtv\nkeyPassword=dtvci123456\n' > androidApp/keystore.properties

      - name: Build release APK
        # Skip the Aliyun mirror in CI (unstable / 502) and use Google/Maven Central directly.
        env:
          DTV_NO_ALIYUN_MIRROR: "true"
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          APK=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          # 发布产物统一命名为 dtv-X-<版本号>.apk（应用内更新会按 .apk 资源匹配）
          ASSET_NAME="dtv-X-${APP_VERSION}.apk"
          mkdir -p out
          cp "$APK" "out/$ASSET_NAME"
          echo "apk_path=out/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dtv-X-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create Release
        if: ${{ steps.apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$APP_VERSION"
          TAG="v${VERSION}"
          # 同名 release 已存在时先删除
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "existing release $TAG found, replacing it"
            gh release delete "$TAG" --yes
          fi
          # release delete 不会删除同名 tag；远程与本地残留都要清掉，
          # 否则 gh 会因为"本地已有同名 tag 但未推送"而拒绝创建
          git push --delete origin "refs/tags/$TAG" || echo "remote tag $TAG absent, skip"
          git tag -d "$TAG" || echo "local tag $TAG absent, skip"
          # 只截取与当前版本对应的 CHANGELOG 小节作为 Release 说明：
          # - v0.1 的发布说明只总结新功能 / 特点，不写问题修复；
          # - 后续版本（如 v0.1.1）的发布说明只写修复了什么，不重复 v0.1 的功能。
          {
            echo "## DTV Mobile 更新说明"
            echo ""
            awk -v ver="v${VERSION}" '
              /^## / {
                if ($0 == "## " ver) { p = 1; next }
                else if ($0 ~ /^## /) { p = 0 }
              }
              p { print }
            ' CHANGELOG.md
          } > release_body.md
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk_path }}" \
            --target "${{ github.sha }}" \
            --title "DTV X v${VERSION}" \
            --notes-file release_body.md
