name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # 应用版本号（需与 androidApp/build.gradle.kts 的 versionName 保持一致）
      APP_VERSION: "0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore androidApp/ci.keystore \
            -alias dtv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dtvci123456 \
            -keypass dtvci123456 \
            -dname "CN=DTV CI, OU=CI, O=DTV, L=Beijing, ST=Beijing, C=CN"
          printf 'storeFile=ci.keystore\nstorePassword=dtvci123456\nkeyAlias=dtv\nkeyPassword=dtvci123456\n' > androidApp/keystore.properties

      - name: Build release APK
        # Skip the Aliyun mirror in CI (unstable / 502) and use Google/Maven Central directly.
        env:
          DTV_NO_ALIYUN_MIRROR: "true"
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          APK=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          # 发布产物统一命名为 dtv-X-<版本号>.apk（应用内更新会按 .apk 资源匹配）
          ASSET_NAME="dtv-X-${APP_VERSION}.apk"
          mkdir -p out
          cp "$APK" "out/$ASSET_NAME"
          echo "apk_path=out/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dtv-X-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create Release
        if: ${{ steps.apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$APP_VERSION"
          TAG="v${VERSION}"
          # 同名 release 已存在时先删除
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "existing release $TAG found, replacing it"
            gh release delete "$TAG" --yes
          fi
          # release delete 不会删除同名 tag；远程与本地残留都要清掉，
          # 否则 gh 会因为"本地已有同名 tag 但未推送"而拒绝创建
          git push --delete origin "refs/tags/$TAG" || echo "remote tag $TAG absent, skip"
          git tag -d "$TAG" || echo "local tag $TAG absent, skip"
          {
            echo "## DTV Mobile 更新说明"
            echo ""
            cat CHANGELOG.md
          } > release_body.md
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk_path }}" \
            --target "${{ github.sha }}" \
            --title "DTV X v${VERSION}" \
            --notes-file release_body.md
